<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talk Directly | Know Your Hidden Secrets and Future</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b0b16;color:#fff;min-height:100vh}.wrap{width:min(900px,94%);margin:auto;padding:40px 0}.card{background:#17152a;border:1px solid #d8b56b44;border-radius:22px;padding:28px;box-shadow:0 20px 60px #0008}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.eyebrow{color:#d8b56b;letter-spacing:3px;font-size:12px;font-weight:800}.title{font-family:Georgia,serif;font-size:42px;margin:10px 0}.muted,.note{color:#c5bfd0}.note{font-size:12px;margin-top:10px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border-radius:10px;border:1px solid #ffffff22;background:#0e0d19;color:#fff;font:inherit}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:999px;padding:13px 22px;background:#d8b56b;color:#15121e;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55}.hidden{display:none!important}.timer{font-weight:900;color:#d8b56b}.chat{height:440px;overflow:auto;background:#0e0d19;border-radius:16px;padding:16px;margin:18px 0}.bubble{max-width:82%;padding:12px 15px;border-radius:15px;margin:10px 0;white-space:pre-wrap;line-height:1.55}.visitor{margin-left:auto;background:#d8b56b;color:#16131d}.admin{background:#27233c;color:#fff}.meta{font-size:11px;opacity:.65;margin-top:5px}.status{margin-top:12px;padding:12px;border-radius:10px;background:#ffffff0b}.success{border:1px solid #5ac58a55}.error{border:1px solid #e16c6c55}@media(max-width:650px){.title{font-size:32px}.card{padding:20px}.chat{height:400px}}
</style></head>
<body><main class="wrap"><section class="card"><div class="top"><div><div class="eyebrow">DIRECT COMMUNICATION</div><h1 class="title">Talk Directly</h1><p class="muted">Ask your question and communicate directly with our team. Your complete name is required.</p></div><div id="timer" class="timer hidden">15:00</div></div>
<div id="startArea"><div class="field"><label>Complete Name *</label><input id="name" autocomplete="name" placeholder="Your first and last name" required></div><div class="field"><label>Mobile Number *</label><input id="phone" autocomplete="tel" placeholder="+91..." required></div><div class="field"><label>Your First Question *</label><textarea id="firstMessage" maxlength="5000" placeholder="Write your question..." required></textarea></div><button id="startBtn" class="btn">💬 Start Direct Conversation</button><p class="note">You can communicate here for 15 minutes. You do not need a customer account.</p></div>
<div id="chatArea" class="hidden"><div id="chat" class="chat"></div><div class="field"><textarea id="message" maxlength="5000" placeholder="Write your next message..."></textarea></div><button id="sendBtn" class="btn">Send Message</button><div id="status" class="status hidden"></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
(function(){const sb=window.supabaseClient,startBtn=document.getElementById("startBtn"),startArea=document.getElementById("startArea"),chatArea=document.getElementById("chatArea"),chat=document.getElementById("chat"),timer=document.getElementById("timer"),status=document.getElementById("status");let token="",expires=0,pollTimer=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function show(msg,type=""){status.className="status "+type;status.textContent=msg;status.classList.remove("hidden");}
function tick(){const left=Math.max(0,Math.ceil((expires-Date.now())/1000));timer.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");if(!left){if(pollTimer)clearInterval(pollTimer);document.getElementById("sendBtn").disabled=true;show("The 15-minute direct conversation has ended.","error");}}
async function call(body){
  const url=window.SUPABASE_URL+"/functions/v1/public-chat";
  const key=window.SUPABASE_PUBLISHABLE_KEY;
  if(!url.startsWith("http")||!key)throw new Error("Secure direct communication is not configured. Please refresh the page.");
  const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","apikey":key,"Authorization":"Bearer "+key},body:JSON.stringify(body)});
  let data=null;
  try{data=await response.json();}catch{}
  if(!response.ok||!data?.success)throw new Error(data?.error||"Unable to communicate right now. Please try again.");
  return data;
}
function render(messages){chat.innerHTML=(messages||[]).map(m=>'<div class="bubble '+(m.sender==="admin"?"admin":"visitor")+'">'+esc(m.message)+'<div class="meta">'+new Date(m.created_at).toLocaleString()+'</div></div>').join("");chat.scrollTop=chat.scrollHeight;}
async function refresh(){try{const d=await call({action:"get_chat",session_token:token});render(d.messages);}catch(e){}}
startBtn.addEventListener("click",async()=>{const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),message=document.getElementById("firstMessage").value.trim();if(name.split(/\s+/).length<2){show("Please enter your complete name (first and last name).","error");return;}if(!phone||!message){show("Please complete all required fields.","error");return;}startBtn.disabled=true;startBtn.textContent="Opening…";try{const d=await call({action:"start_chat",name,phone,email,message});token=d.session_token;expires=d.expires_at;startArea.classList.add("hidden");chatArea.classList.remove("hidden");timer.classList.remove("hidden");render(d.messages);setInterval(tick,1000);pollTimer=setInterval(refresh,3000);tick();}catch(e){show(e.message,"error");startBtn.disabled=false;startBtn.textContent="💬 Start Direct Conversation";}});
document.getElementById("sendBtn").addEventListener("click",async()=>{const b=document.getElementById("message"),message=b.value.trim();if(!message)return;document.getElementById("sendBtn").disabled=true;try{const d=await call({action:"chat_message",session_token:token,message});b.value="";render(d.messages);show(d.message||"Message sent.","success");}catch(e){show(e.message,"error");}finally{document.getElementById("sendBtn").disabled=false;}});
})();</script></body></html>
